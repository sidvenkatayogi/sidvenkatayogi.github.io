<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore Siddhartha Venkatayogi's portfolio in your terminal. Connect with ssh sh.s9v10.dev.">
    <meta name="color-scheme" content="dark">
    <title>terminal — s9v10.dev</title>
    <link rel="canonical" href="https://sh.s9v10.dev/">
    <link rel="stylesheet" href="/assets/css/terminal.css?v=__ASSET_VERSION__">
    <script src="/assets/js/terminal.js?v=__ASSET_VERSION__" defer></script>
</head>
<body class="terminal-landing">
    <a class="terminal-link terminal-home" href="https://s9v10.dev/">main website</a>
    <main class="terminal-connect">
        <section class="terminal-panel" aria-label="Connect to my terminal portfolio">
            <p class="terminal-instruction" id="ssh-instruction">paste this in your terminal</p>
            <div class="terminal-command">
                <code id="ssh-command" tabindex="0" aria-describedby="ssh-instruction">ssh sh.s9v10.dev</code>
                <button class="terminal-copy" type="button" aria-label="Copy SSH command" title="Copy command">
                    <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <rect x="8" y="8" width="12" height="12" rx="2"></rect>
                        <path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"></path>
                    </svg>
                    <svg class="copied-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path d="m5 12 4 4L19 6"></path>
                    </svg>
                </button>
            </div>
            <p class="terminal-intro">btw, SSH = sid's supercool homepage</p>
            <p class="terminal-copy-status" id="terminal-copy-status" role="status" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
